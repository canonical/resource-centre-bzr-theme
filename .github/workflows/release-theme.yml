name: Build theme zip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  THEME_SLUG: resource-centre
  # wordpress-k8s charm revision whose image the theme is added to.
  # Keep this in step with the revision deployed in the Juju model.
  CHARM_REVISION: 190
  IMAGE: ghcr.io/${{ github.repository }}/wordpress-image

jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same PHP version as the wordpress-k8s image (Ubuntu 24.04)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Syntax check
        run: |
          fail=0
          for f in $(git ls-files '*.php'); do php -l "$f" || fail=1; done
          exit $fail

      - name: PHP 8.3 compatibility
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev phpcompatibility/php-compatibility:"^10.0.0@dev"
          "$(composer global config bin-dir --absolute)/phpcs" -p --extensions=php \
            --standard=PHPCompatibility --runtime-set testVersion 8.3 \
            --runtime-set ignore_warnings_on_exit 1 .

  build:
    needs: php-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: git archive --format=zip --prefix="$THEME_SLUG/" -o "$THEME_SLUG.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.THEME_SLUG }}
          path: ${{ env.THEME_SLUG }}.zip

      # Tagged builds become a GitHub release. The latest one is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/resource-centre.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$THEME_SLUG.zip" --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: php-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export theme files
        run: |
          mkdir -p .github/image/theme
          git archive HEAD | tar -x -C .github/image/theme

      - name: Look up the charm's image
        run: |
          url=$(curl -sf -X POST https://api.charmhub.io/v2/charms/refresh \
            -H 'Content-Type: application/json' \
            -d "{\"context\":[],\"actions\":[{\"action\":\"download\",\"instance-key\":\"x\",\"name\":\"wordpress-k8s\",\"revision\":$CHARM_REVISION}],\"fields\":[\"resources\"]}" \
            | jq -r '.results[0].charm.resources[] | select(.name=="wordpress-image") | .download.url')
          creds=$(curl -sfL "$url")
          user=$(jq -r .Username <<<"$creds"); pass=$(jq -r .Password <<<"$creds")
          echo "::add-mask::$pass"
          echo "$pass" | docker login registry.jujucharms.com -u "$user" --password-stdin
          echo "BASE_IMAGE=$(jq -r .ImageName <<<"$creds")" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -t "$IMAGE:build" .github/image

      - name: Check theme is in the image
        run: docker run --rm --entrypoint ls "$IMAGE:build" /var/www/html/wp-content/themes/resource-centre/style.css

      # Tagged builds are pushed as <tag>-charm<revision> and latest
      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in "$GITHUB_REF_NAME-charm$CHARM_REVISION" latest; do
            docker tag "$IMAGE:build" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
